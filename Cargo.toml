[package]
name = "wacht"
version = "0.1.0-beta.5"
authors = ["engineering@intellinesia.com"]
description = "Official Rust SDK for the Wacht platform, providing type-safe API client and authentication middleware"
homepage = "https://wacht.dev"
repository = "https://github.com/wacht-platform/wacht-rs"
documentation = "https://docs.rs/wacht"
readme = "README.md"
keywords = ["wacht", "api", "sdk", "ai", "platform"]
categories = ["api-bindings", "web-programming"]
license = "Apache-2.0"
edition = "2024"

[features]
default = ["axum"]
axum = ["dep:axum", "dep:jsonwebtoken", "dep:tower", "dep:tracing"]

[dependencies]
serde = { version = "^1.0", features = ["derive"] }
serde_json = "^1.0"
serde_repr = "^0.1"
url = "^2.5"
reqwest = { version = "^0.12", default-features = false, features = [
    "json",
    "multipart",
    "rustls-tls",
] }
once_cell = "^1.19"
tokio = { version = "^1.36", features = ["macros", "rt-multi-thread"] }
chrono = { version = "^0.4", features = ["serde"] }
base64 = "0.22"

# Optional dependencies for axum feature
axum = { version = "0.8", features = ["macros"], optional = true }
jsonwebtoken = { version = "9", optional = true }
tower = { version = "0.5", optional = true }
tracing = { version = "0.1", optional = true }
urlencoding = "2.1.3"

[dev-dependencies]
rand = "0.8"
